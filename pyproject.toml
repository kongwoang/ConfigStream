[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "configstream"
version = "0.1.0"
description = "Scalable Configuration Change Storage and Analytics Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["schemas", "generator", "messaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: requires a running Kafka broker and initialized topics"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
